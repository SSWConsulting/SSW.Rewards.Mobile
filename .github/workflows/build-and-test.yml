name: Build and Test (Automation)

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  admin:
    uses: ./.github/workflows/ci.yml
    with:
      project_path: src/AdminUI/AdminUI.csproj

  api:
    uses: ./.github/workflows/ci.yml
    with:
      project_path: src/WebAPI/WebAPI.csproj

  # The AppHost dashboard's DB seed/reset buttons `dotnet run` this tool, so a compile break must fail the PR.
  data-seeder:
    uses: ./.github/workflows/ci.yml
    with:
      project_path: tools/DataSeeder/DataSeeder.csproj

  # Runs the Application unit tests (incl. the demo seeder and local-target guard tests).
  application-tests:
    uses: ./.github/workflows/ci.yml
    with:
      project_path: tests/Application.UnitTests/Application.UnitTests.csproj

  mobile:
    uses: ./.github/workflows/ci.yml
    with:
      project_path: src/MobileUI/MobileUI.csproj
      test_mobile: true

  mobile-core-unit:
    uses: ./.github/workflows/ci.yml
    with:
      project_path: tests/MobileUI.Core.UnitTests/MobileUI.Core.UnitTests.csproj

  mobile-core-integration:
    uses: ./.github/workflows/ci.yml
    with:
      project_path: tests/MobileUI.Core.IntegrationTests/MobileUI.Core.IntegrationTests.csproj
