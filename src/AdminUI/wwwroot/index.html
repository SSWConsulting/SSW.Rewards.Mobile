<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SSW.Rewards.Admin</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="SSW.Rewards.Admin.AdminUI.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <!-- /download/app — Mobile-only fast redirect
         Mobile users (Android/iOS) are redirected to the app store immediately,
         before Blazor WASM boots, so they never wait for the ~2MB runtime download.
         Desktop users fall through and see the DownloadApp.razor Blazor page instead,
         which generates QR codes locally via QRCoder (no external API dependency). -->
    <script>
        (function () {
            var path = (window.location.pathname || "/").replace(/\/+$/, "") || "/";
            if (path !== "/download/app") return;

            var ua = (navigator.userAgent || "").toLowerCase();
            var platform = ((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "").toLowerCase();
            var isAndroid = ua.includes("android");
            var isIos = /iphone|ipad|ipod/.test(ua) || (platform.includes("mac") && (navigator.maxTouchPoints || 0) > 1);

            if (isAndroid) {
                window.location.replace("https://play.google.com/store/apps/details?id=com.ssw.consulting&hl=en_AU");
            } else if (isIos) {
                window.location.replace("https://apps.apple.com/au/app/ssw-rewards/id1482994853");
            }
        })();
    </script>
    <script>
        (function () {
            const scripts = [
                "_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js",
                "js/kiosk.js",
                "_framework/blazor.webassembly.js",
                "_content/MudBlazor/MudBlazor.min.js"
            ];

            for (const source of scripts) {
                const script = document.createElement("script");
                script.src = source;
                document.body.appendChild(script);
            }
        })();
    </script>
</body>

</html>
